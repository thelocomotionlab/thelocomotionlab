<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- Sécurité -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      worker-src 'self' blob:;
      connect-src 'self' data: blob:
        https://send-email.thelocomotionlab.workers.dev
        https://tracking.thelocomotionlab.com
        https://tile.openstreetmap.org
        https://a.tile.openstreetmap.org
        https://b.tile.openstreetmap.org
        https://c.tile.openstreetmap.org
        https://a.tile.opentopomap.org
        https://b.tile.opentopomap.org
        https://c.tile.opentopomap.org
        https://server.arcgisonline.com;
      img-src 'self' data: blob: https:
        https://tile.openstreetmap.org
        https://a.tile.openstreetmap.org
        https://b.tile.openstreetmap.org
        https://c.tile.openstreetmap.org
        https://a.tile.opentopomap.org
        https://b.tile.opentopomap.org
        https://c.tile.opentopomap.org
        https://server.arcgisonline.com;
      style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      object-src 'none';
    ">

    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Serif:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Meta de base -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Locomotion Lab</title>
    <meta
      name="description"
      content="Exploration de la locomotion humaine sous toutes ses formes avec une approche scientifique et expérimentale."
    >
    <meta
      name="keywords"
      content="locomotion, mouvement, ultra-trail, trail primal, parkour primal, respiration, hormèse, conscience, exploration, laboratoire, performance, endurance"
    >
    <meta name="author" content="The Locomotion Lab" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://thelocomotionlab.com/" />

    <!-- Favicon & icônes générés par RealFaviconGenerator -->
    <link rel="apple-touch-icon" sizes="180x180" href="/images/assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/images/assets/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/assets/web-app-manifest-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/images/assets/web-app-manifest-512x512.png">
    <link rel="icon" href="/images/assets/favicon.ico" sizes="any">
    <link rel="mask-icon" href="/images/assets/favicon.svg" color="#EFB159">

    <!-- Manifest PWA -->
    <link rel="manifest" href="/images/assets/site.webmanifest">
    <meta name="theme-color" content="#8CB9BD" />

    <!-- Open Graph -->
    <meta property="og:title" content="The Locomotion Lab" />
    <meta
      property="og:description"
      content="Exploration de la locomotion humaine sous toutes ses formes avec une approche scientifique et expérimentale."
    />
    <meta property="og:image" content="https://thelocomotionlab.com/images/assets/og-image.jpg" />
    <meta property="og:url" content="https://thelocomotionlab.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Locomotion Lab" />
    <meta
      name="twitter:description"
      content="Exploration de la locomotion humaine sous toutes ses formes avec une approche scientifique et expérimentale."
    />
    <meta name="twitter:image" content="https://thelocomotionlab.com/images/assets/og-image.jpg" />

    <!-- Données structurées Schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "The Locomotion Lab",
        "url": "https://thelocomotionlab.com",
        "description": "Exploration de la locomotion humaine sous toutes ses formes avec une approche scientifique et expérimentale.",
        "publisher": {
          "@type": "Organization",
          "name": "The Locomotion Lab"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
