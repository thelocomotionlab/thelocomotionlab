# Stack conteneurs du VPS : reverse-proxy Caddy (HTTPS auto) + apps.
# Lancement : depuis infra/, `./deploy.sh` (ou `docker compose -f compose.yml up -d`).
# Variables & secrets : infra/.env (NON versionné — cf. .env.example).
name: locomotionlab

services:
  # Reverse-proxy unique : HTTPS automatique (Let's Encrypt en DNS-01 Cloudflare),
  # route le sous-domaine de test + (à la bascule) Traccar + les futures apps.
  caddy:
    build:
      context: ./caddy
    image: locomotionlab/caddy:local
    restart: unless-stopped
    # Injecte CF_API_TOKEN / ACME_EMAIL / TRACCAR_API_TOKEN / *_DOMAIN dans le conteneur
    # (le Caddyfile les lit via la syntaxe {$VAR}).
    env_file: .env
    ports:
      # Mode VALIDATION par défaut (8080/8443) : ne touche pas nginx/Traccar (80/443 libres).
      # Mode BASCULE : passe HTTP_PORT=80 / HTTPS_PORT=443 dans .env (cf. runbook étape 4).
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    extra_hosts:
      # Permet à Caddy de joindre Traccar qui tourne sur l'HÔTE (127.0.0.1:8082), pas en conteneur.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Routes par sous-domaine (un fichier .caddy chacune ; *.disabled ignoré).
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      # BASCULE (runbook étape 4) : Caddy sert les live-*.json produits par le
      # service tracking-cache (volume partagé, lecture seule). Requis par
      # conf.d/tracking.caddy (root * /srv/live).
      - live_json:/srv/live:ro
      # Journal de bord du live : Caddy sert journal.json + les médias produits
      # par live-journal (lecture seule). Requis par conf.d/api.caddy
      # (root * /srv/journal/public — seul le sous-arbre public/ est exposé).
      - live_journal_data:/srv/journal:ro
      # Persiste certificats ACME + état (sinon re-émission à chaque redéploiement).
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  # Back live-tracking : interroge Traccar (token via .env), filtre/corrige les
  # positions, écrit live-positions.json + le chrono dans le volume `live_json`.
  # Boucle interne (remplace le timer systemd) ; idle tant que `track start` n'a
  # pas ouvert de session. Pilotage : script `track` (docker compose exec).
  # Non exposé à l'hôte : seuls Caddy (au montage) et la CLI le touchent.
  tracking-cache:
    image: ${TRACKING_CACHE_IMAGE:-ghcr.io/thelocomotionlab/tracking-cache:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - live_json:/data
    extra_hosts:
      # Joindre Traccar qui tourne sur l'HÔTE (127.0.0.1:8082), pas en conteneur.
      - "host.docker.internal:host-gateway"
    networks:
      - web

  # Journal de bord du live (chantier 2) : reçoit le webhook Telegram (texte,
  # photo, vocal, vidéo derrière drapeau), traite les médias (sharp + ffmpeg),
  # écrit journal.json + media/ dans le volume `live_journal_data` que Caddy sert
  # sur {$API_DOMAIN}/journal/* ; transmet les messages privés des visiteurs
  # (POST /message → Telegram de Valentin, AUCUN stockage du contenu).
  # Si le service tombe pendant l'aventure, la LECTURE reste servie par Caddy.
  live-journal:
    image: ${LIVE_JOURNAL_IMAGE:-ghcr.io/thelocomotionlab/live-journal:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    expose:
      - "3000"
    volumes:
      - live_journal_data:/data
    # Premier healthcheck applicatif de la stack (préfigure l'auto-surveillance
    # de la PR5) : l'état est visible dans `docker compose ps`.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/journal/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web

  # App de test, construite par la CI et poussée sur GHCR (cf. .github/workflows/deploy-vps.yml).
  # Non exposée à l'hôte : seul Caddy la joint, par le réseau interne `web`.
  template:
    image: ${TEMPLATE_IMAGE:-ghcr.io/thelocomotionlab/template:latest}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - web

  # Moteur Locomotion Twin (Python/FastAPI + TeXLive). INTERNE : pas de port hôte,
  # joint seulement par l'app twin (et la CLI via `docker compose exec`). La route
  # publique existe en draft (caddy/conf.d/twin-engine.caddy.disabled) si on l'expose
  # un jour. Données (jobs.sqlite + sorties) dans le volume `twin_engine_data` ; les
  # archives brutes sont purgées dès la fin du parsing (jamais conservées).
  twin-engine:
    image: ${TWIN_ENGINE_IMAGE:-ghcr.io/thelocomotionlab/twin-engine:latest}
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
    expose:
      - "8000"
    volumes:
      - twin_engine_data:/data
    networks:
      - web

  # Gestionnaire de liste email auto-hébergé (Listmonk) : contacts, double
  # opt-in, campagnes, désinscription — LA liste vit ici, pas chez un
  # prestataire. L'ENVOI est délégué à un relais SMTP (Brevo — configuré
  # dans l'UI Listmonk, jamais dans le repo ; porte de sortie : Amazon SES,
  # cf. docs/email-setup.md). Exposé par Caddy sur {$LISTE_DOMAIN}.
  listmonk:
    image: listmonk/listmonk:v6.2.0
    restart: unless-stopped
    # --install --idempotent : initialise le schéma au premier lancement
    # seulement ; --upgrade : migre le schéma lors des montées de version.
    command:
      [
        sh,
        -c,
        "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''",
      ]
    environment:
      - TZ=Europe/Paris
      - LISTMONK_app__address=0.0.0.0:9000
      - LISTMONK_db__host=listmonk-db
      - LISTMONK_db__port=5432
      - LISTMONK_db__user=listmonk
      - LISTMONK_db__password=${LISTMONK_DB_PASSWORD}
      - LISTMONK_db__database=listmonk
      - LISTMONK_db__ssl_mode=disable
      # Compte admin créé au premier --install (ensuite géré dans l'UI).
      - LISTMONK_ADMIN_USER=${LISTMONK_ADMIN_USER}
      - LISTMONK_ADMIN_PASSWORD=${LISTMONK_ADMIN_PASSWORD}
    expose:
      - "9000"
    depends_on:
      listmonk-db:
        condition: service_healthy
    networks:
      - web

  # Base PostgreSQL de Listmonk. INTERNE (aucun port hôte). Les contacts
  # sont des données personnelles : sauvegarde requise (cf. infra/README.md
  # § Sauvegardes).
  listmonk-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD=${LISTMONK_DB_PASSWORD}
      - POSTGRES_DB=listmonk
    volumes:
      - listmonk_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  # Fichiers live-*.json produits par tracking-cache et servis par Caddy (bascule).
  live_json:
  # Journal de bord + médias de l'aventure en cours (public/) et état interne +
  # sources originales (private/). PRÉCIEUX et irremplaçable pendant l'aventure :
  # sauvegarde quotidienne requise (cf. README § Sauvegardes).
  live_journal_data:
  # Données du moteur Twin : jobs.sqlite + sorties (PDF/figures). Archives brutes purgées.
  twin_engine_data:
  # Base Listmonk (liste email — données personnelles, à sauvegarder).
  listmonk_db:
