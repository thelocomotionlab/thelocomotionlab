<!-- ============================================================================
     Gabarit de CAMPAGNE « Le Lab » — source de vérité versionnée.
     (annonces, parutions — tout envoi manuel à la liste)

     Les templates de campagne Listmonk vivent EN BASE (pas sur le disque,
     contrairement à l'opt-in) : ce fichier est la référence, l'UI est le
     lieu d'installation.

     INSTALLER (une fois) :
       Listmonk → Campaigns → Templates → + New
         Name : « Le Lab »   ·   Type : Campaign
         Body : coller TOUT ce fichier (sans ce commentaire d'en-tête si tu
                préfères, il est inoffensif) → Save → menu ⋮ → Set as default.
     METTRE À JOUR : éditer CE fichier (commit), puis recoller le contenu
       dans l'UI (Campaigns → Templates → « Le Lab » → Edit).

     Fonctionnement : à l'envoi d'une campagne, Listmonk remplace
     {{ template "content" . }} par le corps rédigé dans l'éditeur de la
     campagne. Le lien de désinscription {{ UnsubscribeURL }} est OBLIGATOIRE
     (légal) — il est dans le pied de page. Pas de pixel de tracking
     ({{ TrackView }} volontairement absent : choix du labo).

     Design = mêmes tokens que email-templates/subscriber-optin.html
     (brand-bg #FEFBF6, brand-primary #8CB9BD, accent #EFB159, texte #333),
     wordmark en texte, tout en styles inline (seule mise en page fiable en
     email). Pour un bouton d'appel à l'action dans une campagne, copier le
     pattern commenté en bas de fichier dans l'éditeur de campagne.
     ========================================================================= -->
<!doctype html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
        <base target="_blank">
        <style>
            @media screen and (max-width: 600px) {
                .ll-wrap { padding: 24px 18px !important; }
                .ll-gutter { padding: 12px !important; }
            }
            /* Confort de lecture du corps rédigé dans l'éditeur de campagne. */
            .ll-content p { margin: 0 0 16px; }
            .ll-content h2 { font-family: Lora, Georgia, 'Times New Roman', serif; font-size: 20px; margin: 28px 0 12px; color: #333333; }
            .ll-content h3 { font-size: 17px; margin: 24px 0 10px; color: #333333; }
            .ll-content a { color: #B67352; }
            .ll-content img { max-width: 100%; height: auto; border-radius: 10px; }
            .ll-content blockquote { margin: 0 0 16px; padding-left: 14px; border-left: 3px solid #8CB9BD; color: #555555; }
        </style>
    </head>
    <body style="margin:0; padding:0; background-color:#FEFBF6; font-family:Ubuntu,'Helvetica Neue','Segoe UI',Helvetica,Arial,sans-serif; font-size:16px; line-height:1.6; color:#333333;">
        <div class="ll-gutter" style="padding:28px;">&nbsp;</div>
        <div class="ll-wrap" style="background-color:#ffffff; max-width:560px; margin:0 auto; padding:36px 40px; border-radius:14px; border:1px solid #F0E9DD;">
            <div style="padding-bottom:18px; margin-bottom:24px; border-bottom:3px solid #8CB9BD;">
                <span style="font-family:Lora,Georgia,'Times New Roman',serif; font-size:22px; font-weight:700; color:#333333;">The Locomotion Lab</span>
            </div>
            <div class="ll-content">
                {{ template "content" . }}
            </div>
        </div>
        <div style="text-align:center; font-size:12px; color:#888888; padding:20px 12px;">
            <p style="margin:0 0 4px;">The Locomotion Lab · <a href="https://thelocomotionlab.com" style="color:#888888;">thelocomotionlab.com</a></p>
            <p style="margin:0 0 4px;">Tu reçois cet email parce que tu t'es inscrit·e aux nouvelles du labo.</p>
            <p style="margin:0;"><a href="{{ UnsubscribeURL }}" style="color:#888888;">Se désinscrire</a></p>
        </div>
        <div class="ll-gutter" style="padding:28px;">&nbsp;</div>
    </body>
</html>
